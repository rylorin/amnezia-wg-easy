name: Deploy to docker hub

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/deploy-dockerhub.yml'
      - 'Dockerfile'
  schedule:
    - cron: '0 3 1 * *' # Runs at 03:00 AM (UTC) on the 1st of every month

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set environment variables
        run: echo RELEASE=$(cat ./package.json | jq -r .version) >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64/v8
          tags: ${{ github.repository }}:latest,${{ github.repository }}:${{ env.RELEASE }}
          context: .
